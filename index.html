<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - 智慧待辦事項管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.6);
    }

    /* Checkbox & Task card animations */
    .task-item {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .task-item:hover {
      transform: translateY(-2px);
    }
    .task-enter {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .task-leave {
      animation: slideOut 0.25s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes slideOut {
      from { opacity: 1; transform: translateY(0) scale(1); max-height: 100px; }
      to { opacity: 0; transform: translateY(-10px) scale(0.95); max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full transition-colors duration-300 flex flex-col">

  <div class="max-w-4xl w-full mx-auto px-4 py-8 flex-1 flex flex-col">
    <!-- Header Bar -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 border-b border-slate-200 dark:border-slate-800 pb-5">
      <div>
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center shadow-lg shadow-brand-500/30">
            <i class="fa-solid fa-list-check text-xl"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-brand-600 to-indigo-500 bg-clip-text text-transparent">TaskFlow</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400" id="current-date-display">2026年9月24日 星期四</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 self-end sm:self-auto">
        <!-- Import/Export Tools -->
        <button onclick="exportData()" title="匯出資料 JSON" class="p-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
          <i class="fa-solid fa-download"></i>
        </button>
        <button onclick="triggerImport()" title="匯入資料 JSON" class="p-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
          <i class="fa-solid fa-upload"></i>
        </button>
        <input type="file" id="import-file-input" accept=".json" class="hidden" onchange="importData(event)">

        <!-- Dark Mode Toggle -->
        <button id="theme-toggle" class="p-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
          <i class="fa-solid fa-moon text-lg dark:hidden"></i>
          <i class="fa-solid fa-sun text-lg hidden dark:block text-amber-400"></i>
        </button>
      </div>
    </header>

    <!-- Progress Stats Card -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/60 mb-6">
      <div class="flex justify-between items-center mb-3">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">今日完成率</span>
          <h2 class="text-2xl font-bold mt-0.5" id="stats-text">0 / 0 <span class="text-sm font-normal text-slate-500">(0%)</span></h2>
        </div>
        <div id="stats-badge" class="px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300">
          無任務
        </div>
      </div>
      <!-- Progress Bar -->
      <div class="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
        <div id="progress-bar-fill" class="bg-brand-600 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
      </div>
    </div>

    <!-- Add Task Input Form -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/60 mb-6">
      <form id="add-todo-form" onsubmit="handleAddTask(event)" class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-3">
          <input 
            type="text" 
            id="task-title-input" 
            placeholder="今天想完成什麼任務？..." 
            required
            class="flex-1 px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm transition-all"
          >
          <button 
            type="submit" 
            class="px-6 py-3 bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-medium rounded-xl shadow-md shadow-brand-500/20 transition-all flex items-center justify-center gap-2 shrink-0"
          >
            <i class="fa-solid fa-plus"></i>
            <span>新增任務</span>
          </button>
        </div>

        <!-- Task Metadata Controls -->
        <div class="flex flex-wrap gap-3 pt-1 text-xs">
          <!-- Category -->
          <div class="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg">
            <i class="fa-solid fa-tag text-slate-400"></i>
            <span class="text-slate-500">分類：</span>
            <select id="task-category-input" class="bg-transparent focus:outline-none text-slate-700 dark:text-slate-200 font-medium cursor-pointer">
              <option value="工作">💼 工作</option>
              <option value="個人" selected>👤 個人</option>
              <option value="學習">📚 學習</option>
              <option value="購物">🛒 購物</option>
              <option value="健康">🏃 健康</option>
            </select>
          </div>

          <!-- Priority -->
          <div class="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg">
            <i class="fa-solid fa-flag text-slate-400"></i>
            <span class="text-slate-500">優先度：</span>
            <select id="task-priority-input" class="bg-transparent focus:outline-none text-slate-700 dark:text-slate-200 font-medium cursor-pointer">
              <option value="low">🟢 低</option>
              <option value="medium" selected>🟡 中</option>
              <option value="high">🔴 高</option>
            </select>
          </div>

          <!-- Due Date -->
          <div class="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-lg">
            <i class="fa-solid fa-calendar text-slate-400"></i>
            <span class="text-slate-500">到期日：</span>
            <input type="date" id="task-duedate-input" class="bg-transparent focus:outline-none text-slate-700 dark:text-slate-200 cursor-pointer">
          </div>
        </div>
      </form>
    </div>

    <!-- Filters & Search Toolbar -->
    <div class="flex flex-col md:flex-row gap-3 justify-between items-stretch md:items-center mb-4">
      <!-- Status Tabs -->
      <div class="flex bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl text-xs font-medium self-start md:self-auto">
        <button onclick="setFilterStatus('all')" id="tab-all" class="filter-tab px-3.5 py-2 rounded-lg transition-all bg-white dark:bg-slate-700 shadow-sm text-slate-800 dark:text-white">全部</button>
        <button onclick="setFilterStatus('active')" id="tab-active" class="filter-tab px-3.5 py-2 rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900">進行中</button>
        <button onclick="setFilterStatus('completed')" id="tab-completed" class="filter-tab px-3.5 py-2 rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900">已完成</button>
      </div>

      <div class="flex flex-wrap sm:flex-nowrap gap-2 items-center">
        <!-- Search Input -->
        <div class="relative flex-1 sm:w-48">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="搜尋任務..." 
            oninput="renderTasks()"
            class="w-full pl-8 pr-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-brand-500"
          >
        </div>

        <!-- Category Filter -->
        <select id="category-filter" onchange="renderTasks()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none text-slate-700 dark:text-slate-200 cursor-pointer">
          <option value="all">所有分類</option>
          <option value="工作">💼 工作</option>
          <option value="個人">👤 個人</option>
          <option value="學習">📚 學習</option>
          <option value="購物">🛒 購物</option>
          <option value="健康">🏃 健康</option>
        </select>

        <!-- Sort Option -->
        <select id="sort-select" onchange="renderTasks()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none text-slate-700 dark:text-slate-200 cursor-pointer">
          <option value="created-desc">最新建立</option>
          <option value="created-asc">最舊建立</option>
          <option value="duedate">依到期日</option>
          <option value="priority">依優先度</option>
        </select>
      </div>
    </div>

    <!-- Task List Container -->
    <div id="task-list-container" class="space-y-2.5 flex-1 min-h-[200px]">
      <!-- Task items rendered dynamically by JavaScript -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
      <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-300 dark:text-slate-600 mb-3 text-2xl">
        <i class="fa-solid fa-clipboard-check"></i>
      </div>
      <h3 class="text-slate-600 dark:text-slate-400 font-medium text-base mb-1">目前沒有待辦事項</h3>
      <p class="text-xs text-slate-400 dark:text-slate-500">好好放鬆一下，或者新增一個新任務吧！</p>
    </div>

    <!-- Footer / Bulk Actions -->
    <footer class="mt-8 pt-4 border-t border-slate-200 dark:border-slate-800 flex flex-wrap justify-between items-center text-xs text-slate-500 gap-3">
      <span id="remaining-count-text">未完成: 0 項</span>
      
      <div class="flex gap-3">
        <button onclick="clearCompletedTasks()" class="hover:text-amber-600 transition-colors">
          <i class="fa-solid fa-broom mr-1"></i>清除已完成
        </button>
        <button onclick="promptClearAll()" class="hover:text-red-600 transition-colors">
          <i class="fa-solid fa-trash-can mr-1"></i>清除全部
        </button>
      </div>
    </footer>
  </div>

  <!-- Edit Modal Dialog -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-md w-full shadow-xl border border-slate-200 dark:border-slate-700 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg">編輯任務</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <input type="hidden" id="edit-task-id">

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">任務內容</label>
        <input type="text" id="edit-task-title" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">分類</label>
          <select id="edit-task-category" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none">
            <option value="工作">💼 工作</option>
            <option value="個人">👤 個人</option>
            <option value="學習">📚 學習</option>
            <option value="購物">🛒 購物</option>
            <option value="健康">🏃 健康</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">優先度</label>
          <select id="edit-task-priority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none">
            <option value="low">🟢 低</option>
            <option value="medium">🟡 中</option>
            <option value="high">🔴 高</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">到期日</label>
        <input type="date" id="edit-task-duedate" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none">
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-medium rounded-xl">取消</button>
        <button onclick="saveTaskEdit()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium rounded-xl">儲存變更</button>
      </div>
    </div>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-xl border border-slate-200 dark:border-slate-700 text-center space-y-4">
      <div class="w-12 h-12 bg-red-100 dark:bg-red-900/30 text-red-500 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 class="font-bold text-base" id="confirm-modal-title">確定清除？</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400" id="confirm-modal-msg">此操作將無法復原。</p>
      <div class="flex justify-center gap-2 pt-2">
        <button onclick="closeConfirmModal()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-medium rounded-xl">取消</button>
        <button id="confirm-modal-action-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-medium rounded-xl">確定刪除</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

  <script>
    // State Variables
    let todos = [];
    let currentFilterStatus = 'all'; // 'all', 'active', 'completed'
    const STORAGE_KEY = 'taskflow_todos_v1';

    // Priority configuration mapping
    const PRIORITY_MAP = {
      high: { label: '高', color: 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300 border-red-200 dark:border-red-800', weight: 3 },
      medium: { label: '中', color: 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300 border-amber-200 dark:border-amber-800', weight: 2 },
      low: { label: '低', color: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800', weight: 1 }
    };

    // Category Icons mapping
    const CATEGORY_MAP = {
      '工作': '💼',
      '個人': '👤',
      '學習': '📚',
      '購物': '🛒',
      '健康': '🏃'
    };

    // Initialize application on load
    window.onload = function() {
      initTheme();
      displayCurrentDate();
      loadTodosFromStorage();
      renderTasks();
    };

    // Date display
    function displayCurrentDate() {
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      const today = new Date().toLocaleDateString('zh-TW', options);
      document.getElementById('current-date-display').innerText = today;
    }

    // Storage Handling
    function loadTodosFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          todos = JSON.parse(stored);
        } else {
          todos = [];
          saveTodosToStorage();
        }
      } catch (e) {
        console.error('Failed to load tasks:', e);
        todos = [];
      }
    }

    function saveTodosToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // Add New Task
    function handleAddTask(event) {
      event.preventDefault();
      const titleInput = document.getElementById('task-title-input');
      const categoryInput = document.getElementById('task-category-input');
      const priorityInput = document.getElementById('task-priority-input');
      const dueDateInput = document.getElementById('task-duedate-input');

      const title = titleInput.value.trim();
      if (!title) return;

      const newTask = {
        id: Date.now().toString(),
        title: title,
        category: categoryInput.value,
        priority: priorityInput.value,
        dueDate: dueDateInput.value,
        completed: false,
        createdAt: Date.now()
      };

      todos.unshift(newTask);
      saveTodosToStorage();
      renderTasks();

      // Reset form title
      titleInput.value = '';
      showToast('已新增任務！', 'success');
    }

    // Toggle Task Completed
    function toggleTask(id) {
      const task = todos.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTodosToStorage();
        renderTasks();
        showToast(task.completed ? '標記為已完成！' : '標記為未完成', 'info');
      }
    }

    // Delete Task
    function deleteTask(id) {
      const index = todos.findIndex(t => t.id === id);
      if (index !== -1) {
        todos.splice(index, 1);
        saveTodosToStorage();
        renderTasks();
        showToast('已刪除任務', 'warning');
      }
    }

    // Open Edit Modal
    function openEditModal(id) {
      const task = todos.find(t => t.id === id);
      if (!task) return;

      document.getElementById('edit-task-id').value = task.id;
      document.getElementById('edit-task-title').value = task.title;
      document.getElementById('edit-task-category').value = task.category;
      document.getElementById('edit-task-priority').value = task.priority;
      document.getElementById('edit-task-duedate').value = task.dueDate || '';

      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    // Save Task Edit
    function saveTaskEdit() {
      const id = document.getElementById('edit-task-id').value;
      const task = todos.find(t => t.id === id);
      if (!task) return;

      const newTitle = document.getElementById('edit-task-title').value.trim();
      if (!newTitle) {
        showToast('請輸入任務內容', 'warning');
        return;
      }

      task.title = newTitle;
      task.category = document.getElementById('edit-task-category').value;
      task.priority = document.getElementById('edit-task-priority').value;
      task.dueDate = document.getElementById('edit-task-duedate').value;

      saveTodosToStorage();
      renderTasks();
      closeEditModal();
      showToast('更新成功！', 'success');
    }

    // Filter & Sort Tasks
    function getFilteredAndSortedTasks() {
      const searchKeyword = document.getElementById('search-input').value.toLowerCase();
      const categoryFilter = document.getElementById('category-filter').value;
      const sortBy = document.getElementById('sort-select').value;

      return todos.filter(task => {
        // Status Filter
        if (currentFilterStatus === 'active' && task.completed) return false;
        if (currentFilterStatus === 'completed' && !task.completed) return false;

        // Category Filter
        if (categoryFilter !== 'all' && task.category !== categoryFilter) return false;

        // Search Filter
        if (searchKeyword && !task.title.toLowerCase().includes(searchKeyword)) return false;

        return true;
      }).sort((a, b) => {
        if (sortBy === 'created-desc') return b.createdAt - a.createdAt;
        if (sortBy === 'created-asc') return a.createdAt - b.createdAt;
        if (sortBy === 'priority') return PRIORITY_MAP[b.priority].weight - PRIORITY_MAP[a.priority].weight;
        if (sortBy === 'duedate') {
          if (!a.dueDate) return 1;
          if (!b.dueDate) return -1;
          return new Date(a.dueDate) - new Date(b.dueDate);
        }
        return 0;
      });
    }

    // Set Active Status Tab
    function setFilterStatus(status) {
      currentFilterStatus = status;
      
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-slate-800', 'dark:text-white');
        btn.classList.add('text-slate-600', 'dark:text-slate-400');
      });

      const activeBtn = document.getElementById(`tab-${status}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-slate-800', 'dark:text-white');
        activeBtn.classList.remove('text-slate-600', 'dark:text-slate-400');
      }

      renderTasks();
    }

    function renderTasks() {
      const container = document.getElementById('task-list-container');
      const emptyState = document.getElementById('empty-state');
      const filteredTasks = getFilteredAndSortedTasks();

      // Render Empty State
      if (filteredTasks.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');

        const todayStr = new Date().toISOString().split('T')[0];

        container.innerHTML = filteredTasks.map(task => {
          const priorityInfo = PRIORITY_MAP[task.priority] || PRIORITY_MAP.medium;
          const isOverdue = task.dueDate && task.dueDate < todayStr && !task.completed;
          const categoryIcon = CATEGORY_MAP[task.category] || '📌';

          return `
            <div class="task-item bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border ${task.completed ? 'border-slate-100 dark:border-slate-800 opacity-60' : 'border-slate-200/80 dark:border-slate-700/60'} flex items-center justify-between gap-3 group">
              <!-- Checkbox & Content -->
              <div class="flex items-center gap-3.5 flex-1 min-w-0">
                <button 
                  onclick="toggleTask('${task.id}')"
                  class="w-6 h-6 rounded-lg border-2 ${task.completed ? 'bg-brand-600 border-brand-600 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-brand-500'} flex items-center justify-center transition-all shrink-0 cursor-pointer"
                >
                  ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                </button>

                <div class="min-w-0 flex-1">
                  <p class="text-sm font-medium ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'} truncate">
                    ${escapeHTML(task.title)}
                  </p>
                  
                  <div class="flex flex-wrap items-center gap-2 mt-1.5 text-[11px]">
                    <!-- Category Badge -->
                    <span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 font-normal">
                      ${categoryIcon} ${task.category}
                    </span>

                    <!-- Priority Badge -->
                    <span class="px-2 py-0.5 rounded-md border text-[10px] font-semibold ${priorityInfo.color}">
                      ${priorityInfo.label}優先
                    </span>

                    <!-- Due Date Badge -->
                    ${task.dueDate ? `
                      <span class="flex items-center gap-1 ${isOverdue ? 'text-red-500 font-semibold' : 'text-slate-400 dark:text-slate-500'}">
                        <i class="fa-regular fa-clock"></i>
                        ${task.dueDate} ${isOverdue ? '(已逾期)' : ''}
                      </span>
                    ` : ''}
                  </div>
                </div>
              </div>

              <!-- Actions -->
              <div class="flex items-center gap-1 opacity-90 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                <button 
                  onclick="openEditModal('${task.id}')" 
                  class="p-2 text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors"
                  title="編輯"
                >
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button 
                  onclick="deleteTask('${task.id}')" 
                  class="p-2 text-slate-400 hover:text-red-600 dark:hover:text-red-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors"
                  title="刪除"
                >
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      updateStats();
    }

    // Stats calculation
    function updateStats() {
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const remaining = total - completed;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById('stats-text').innerHTML = `${completed} / ${total} <span class="text-sm font-normal text-slate-500 dark:text-slate-400">(${percent}%)</span>`;
      document.getElementById('progress-bar-fill').style.width = `${percent}%`;
      document.getElementById('remaining-count-text').innerText = `未完成: ${remaining} 項`;

      const badge = document.getElementById('stats-badge');
      if (total === 0) {
        badge.innerText = '尚無任務';
        badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300';
      } else if (percent === 100) {
        badge.innerText = '🎉 全部完成！';
        badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300';
      } else {
        badge.innerText = '💪 努力推進中';
        badge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300';
      }
    }

    // Bulk Clear Completed Tasks
    function clearCompletedTasks() {
      const completedCount = todos.filter(t => t.completed).length;
      if (completedCount === 0) {
        showToast('目前沒有已完成的任務', 'info');
        return;
      }

      showConfirmModal(
        '清除已完成任務',
        `確定要清除 ${completedCount} 個已完成的任務嗎？`,
        () => {
          todos = todos.filter(t => !t.completed);
          saveTodosToStorage();
          renderTasks();
          showToast('已清除所有完成任務', 'success');
        }
      );
    }

    // Clear All Tasks
    function promptClearAll() {
      if (todos.length === 0) {
        showToast('目前清單為空', 'info');
        return;
      }

      showConfirmModal(
        '清除全部任務',
        '確定要刪除所有待辦事項嗎？此動作將無法復原！',
        () => {
          todos = [];
          saveTodosToStorage();
          renderTasks();
          showToast('所有任務已清空', 'warning');
        }
      );
    }

    // Modal Confirmation Helper
    function showConfirmModal(title, message, onConfirm) {
      document.getElementById('confirm-modal-title').innerText = title;
      document.getElementById('confirm-modal-msg').innerText = message;
      
      const actionBtn = document.getElementById('confirm-modal-action-btn');
      actionBtn.onclick = function() {
        onConfirm();
        closeConfirmModal();
      };

      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
    }

    // Export Tasks as JSON
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(todos, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `taskflow_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('備份 JSON 檔案已下載', 'success');
    }

    function triggerImport() {
      document.getElementById('import-file-input').click();
    }

    // Import Tasks JSON
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            todos = imported;
            saveTodosToStorage();
            renderTasks();
            showToast('成功匯入任務資料！', 'success');
          } else {
            showToast('檔案格式無效', 'warning');
          }
        } catch (err) {
          showToast('無法解析 JSON 檔案', 'warning');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Theme Controller
    function initTheme() {
      const themeToggleBtn = document.getElementById('theme-toggle');
      const isDark = localStorage.getItem('theme') === 'dark' || 
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);

      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      themeToggleBtn.onclick = () => {
        document.documentElement.classList.toggle('dark');
        const darkNow = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', darkNow ? 'dark' : 'light');
      };
    }

    // Toast Notifications
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      const bgColors = {
        success: 'bg-emerald-600 text-white',
        warning: 'bg-amber-600 text-white',
        info: 'bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900'
      };

      toast.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium ${bgColors[type]} flex items-center gap-2 transform transition-all duration-300 translate-y-4 opacity-0`;
      toast.innerHTML = `<span>${message}</span>`;

      container.appendChild(toast);

      // Trigger animation
      setTimeout(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      }, 10);

      // Remove toast after delay
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Utility: HTML Escaping
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
